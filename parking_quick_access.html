<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>駐車場マニュアル クイックアクセス</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f3; --bg3: #eeede8;
    --text: #1a1a18; --text2: #73726c; --text3: #9c9a92;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --info-bg: #E6F1FB; --info-text: #0C447C; --info-border: #85B7EB;
    --success-bg: #EAF3DE; --success-text: #27500A;
    --radius: 8px; --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c; --bg2: #2a2a28; --bg3: #323230;
      --text: #e8e6de; --text2: #9c9a92; --text3: #73726c;
      --border: rgba(255,255,255,0.12); --border2: rgba(255,255,255,0.22);
      --info-bg: #0c2a44; --info-text: #85B7EB; --info-border: #185FA5;
      --success-bg: #1a2e10; --success-text: #97C459;
    }
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif; font-size: 15px; min-height: 100vh; padding: 16px; }
  .container { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: var(--text3); margin-bottom: 24px; }
  .section-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 8px; }
  .park-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .park-btn { padding: 8px 18px; border-radius: 20px; border: 0.5px solid var(--border2); background: var(--bg); color: var(--text2); font-size: 13px; cursor: pointer; transition: all .15s; }
  .park-btn:hover { background: var(--bg2); }
  .park-btn.active { background: var(--info-bg); color: var(--info-text); border-color: var(--info-border); font-weight: 600; }
  .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
  @media(max-width:420px){ .cat-grid { grid-template-columns: 1fr; } }
  .cat-btn { padding: 13px 14px; border-radius: var(--radius-lg); border: 0.5px solid var(--border); background: var(--bg); cursor: pointer; text-align: left; transition: all .15s; }
  .cat-btn:hover { background: var(--bg2); }
  .cat-btn.active { border-width: 1.5px; }
  .cat-icon { font-size: 20px; display: block; margin-bottom: 5px; }
  .cat-name { font-size: 13px; font-weight: 600; display: block; margin-bottom: 2px; }
  .cat-sub { font-size: 11px; color: var(--text3); display: block; line-height: 1.4; }
  .q-section { display: none; }
  .toast { display: none; align-items: center; gap: 8px; padding: 10px 14px; background: var(--success-bg); border-radius: var(--radius); font-size: 12px; color: var(--success-text); margin-bottom: 14px; border: 0.5px solid rgba(0,0,0,0.06); }
  .toast.show { display: flex; }
  .q-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .q-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--bg); cursor: pointer; text-align: left; transition: background .12s; width: 100%; }
  .q-btn:hover { background: var(--bg2); }
  .q-btn:active { transform: scale(0.99); }
  .q-num { font-size: 12px; color: var(--text3); flex-shrink: 0; width: 18px; }
  .q-text { font-size: 13px; color: var(--text); flex: 1; line-height: 1.5; }
  .copy-badge { font-size: 10px; color: var(--text3); border: 0.5px solid var(--border); border-radius: 4px; padding: 2px 6px; white-space: nowrap; flex-shrink: 0; }
  .other-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .other-row { display: flex; gap: 8px; margin-bottom: 24px; }
  .other-input { flex: 1; font-size: 13px; padding: 10px 12px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text); outline: none; }
  .other-input:focus { border-color: var(--info-border); }
  .other-btn { padding: 10px 16px; font-size: 13px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); cursor: pointer; white-space: nowrap; font-weight: 500; }
  .other-btn:hover { background: var(--bg2); }
  .how-box { background: var(--bg2); border-radius: var(--radius-lg); padding: 14px 16px; }
  .how-title { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 10px; }
  .how-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 7px; font-size: 12px; color: var(--text2); line-height: 1.6; }
  .how-num { width: 20px; height: 20px; border-radius: 50%; background: var(--info-bg); color: var(--info-text); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  hr { border: none; border-top: 0.5px solid var(--border); margin: 20px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>駐車場マニュアル クイックアクセス</h1>
  <p class="subtitle">駐車場を選んでカテゴリをタップ → Notion AIに貼り付けるだけ</p>

  <div class="section-label">駐車場を選ぶ</div>
  <div class="park-row" id="parkRow"></div>

  <div class="section-label">カテゴリを選ぶ</div>
  <div class="cat-grid" id="catGrid"></div>

  <div class="q-section" id="qSection">
    <div id="toast" class="toast">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 7l2 2 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="toastMsg"></span>
    </div>
    <div class="section-label">質問をタップ → Notion AIに貼り付け</div>
    <div class="q-list" id="qList"></div>
    <div class="other-label">その他（任意入力）</div>
    <div class="other-row">
      <input class="other-input" type="text" id="customInput" placeholder="自由に質問を入力...">
      <button class="other-btn" onclick="copyCustom()">コピー</button>
    </div>
  </div>

  <div class="how-box">
    <div class="how-title">使い方</div>
    <div class="how-row"><div class="how-num">1</div>上で駐車場ボタンをタップして物件を選ぶ</div>
    <div class="how-row"><div class="how-num">2</div>カテゴリボタンをタップする</div>
    <div class="how-row"><div class="how-num">3</div>質問をタップ → クリップボードにコピーされる</div>
    <div class="how-row"><div class="how-num">4</div>Notion AIを開いて長押し → ペーストで貼り付ける</div>
  </div>
</div>

<script>
// =============================================
// ★ 物件名はここに追加するだけ
// =============================================
const parks = [
  { id: 'park', name: '駐車場' },
  { id: 'park2', name: '駐車場2' },
  { id: 'park3', name: 'パーキング3' },
];

// =============================================
// カテゴリ定義（共通）
// =============================================
const cats = [
  { id: 'entry',    icon: '🔑', name: '入館手順',           sub: '鍵・防災センター・ルート',     color: '#EEEDFE', border: '#AFA9EC', textColor: '#3C3489' },
  { id: 'fire',     icon: '🔥', name: '火災警報の対応手順', sub: '誤警報確認・避難・EV車対応',   color: '#FCEBEB', border: '#F09595', textColor: '#A32D2D' },
  { id: 'flood',    icon: '🌧️', name: '大雨・洪水警報',    sub: '準備レベル・緊急連絡体制',     color: '#E6F1FB', border: '#85B7EB', textColor: '#0C447C' },
  { id: 'checkin',  icon: '🚘', name: '入庫の対応手順',     sub: '支払い・おつり・モニター確認', color: '#E1F5EE', border: '#5DCAA5', textColor: '#085041' },
  { id: 'checkout', icon: '🚗', name: '出庫の対応手順',     sub: 'モニター確認・指示出し',       color: '#FAEEDA', border: '#EF9F27', textColor: '#633806' },
];

// =============================================
// 質問リスト（全駐車場共通）
// =============================================
const questions = {
  entry: [
    '鍵の保管場所はどこですか？',
    '鍵の受け渡し手順を教えてください',
    '具体的に何をすれば入館できますか？',
    '鍵に暗証番号はありますか？',
    'ビルの入り口から防災センターへのルートを教えてください',
  ],
  fire: [
    '本当の火災か誤警報か確かめる手段は何ですか？',
    '本当の火災の場合の対応手順を教えてください',
    'EV車が絡む火災の場合はどんな対応をしますか？',
  ],
  flood: [
    'どんなレベルで準備を始めれば良いですか？',
    '緊急連絡体制を教えてください',
  ],
  checkin: [
    '費用の支払い方法を教えてください',
    'おつりやレシートの受け渡し方法は？',
    'モニターがある場合の見方を教えてください',
  ],
  checkout: [
    'モニターがある場合の見方を教えてください',
    '出庫時にどんな指示を出せばいいですか？',
  ],
};

// =============================================
// 以下はロジック（変更不要）
// =============================================
let selPark = null, selCat = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}
function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(() => fallback(text));
  } else { fallback(text); }
}
function fallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}
function copyCustom() {
  const val = document.getElementById('customInput').value.trim();
  if (!val) return;
  const park = parks.find(p => p.id === selPark);
  const full = (park ? park.name + 'について：' : '') + val;
  copyText(full);
  showToast('コピーしました');
}

function renderParks() {
  const row = document.getElementById('parkRow');
  row.innerHTML = '';
  parks.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'park-btn' + (selPark === p.id ? ' active' : '');
    btn.textContent = selPark === p.id ? '✓ ' + p.name : p.name;
    btn.onclick = () => { selPark = p.id; renderParks(); updateQ(); };
    row.appendChild(btn);
  });
}

function renderCats() {
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (selCat === c.id ? ' active' : '');
    if (selCat === c.id) {
      btn.style.background = c.color;
      btn.style.borderColor = c.border;
    }
    const nameStyle = selCat === c.id ? `color:${c.textColor}` : '';
    btn.innerHTML = `<span class="cat-icon">${c.icon}</span><span class="cat-name" style="${nameStyle}">${c.name}</span><span class="cat-sub">${c.sub}</span>`;
    btn.onclick = () => { selCat = c.id; renderCats(); updateQ(); };
    grid.appendChild(btn);
  });
}

function updateQ() {
  const sec = document.getElementById('qSection');
  const list = document.getElementById('qList');
  if (!selPark || !selCat) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  const park = parks.find(p => p.id === selPark);
  const qs = questions[selCat] || [];
  list.innerHTML = '';
  qs.forEach((q, i) => {
    const full = park.name + 'について：' + q;
    const btn = document.createElement('button');
    btn.className = 'q-btn';
    btn.innerHTML = `<span class="q-num">${i+1}.</span><span class="q-text">${q}</span><span class="copy-badge">コピー</span>`;
    btn.onclick = () => { copyText(full); showToast('コピー：' + q); };
    list.appendChild(btn);
  });
  document.getElementById('customInput').value = '';
}

renderParks();
renderCats();
</script>
</body>
</html>
